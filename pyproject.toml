[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-binance-repricing-bot"
version = "0.1.0"
description = "Async-first skeleton for a low-latency Polymarket/Binance probabilistic repricing bot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "websockets>=12.0",
  "aiohttp>=3.9",
  "python-dotenv>=1.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "structlog>=24.1",
  "orjson>=3.10",
]

[tool.setuptools.packages.find]
where = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["bot"]
testpaths = ["tests"]
